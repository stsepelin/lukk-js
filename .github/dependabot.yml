version: 2

updates:
  # The advisories that prompted this all lived in the dev tree — `nuxt` and what it pulls in.
  # Nothing reaches a consumer (the module ships `@nuxt/kit`, `defu` and `ofetch`), but a lockfile
  # nobody bumps is how 18 open alerts accumulate in the first place.
  #
  # Grouped so the weekly noise is one PR, and split dev/prod so a runtime bump — the only kind
  # that can affect a consumer's install — arrives on its own and gets read.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # vitest 5 is held back by the MUTATION gate, not by the test suite — which passes on it. Stryker
      # 10's vitest runner uses "perTest" coverage analysis to decide which tests to run for each mutant,
      # and on vitest 5 that mapping comes back empty: measured here, `session.server.ts` scored 100.00%
      # (29 killed) on vitest 3 and 13.79% on vitest 5, running 0.13 tests per mutant instead of 2.63.
      # With `thresholds.break = 100` that fails every mutation run while proving nothing. Drop this once
      # @stryker-mutator/vitest-runner declares vitest 5 support, and re-measure before trusting a score.
      # vitest 4 (4.1.12) is no shortcut: it clears the tinypool and @vitest/mocker advisories, but its v8
      # coverage remapping drops lukk-nuxt under the 100% gate (functions 99.15%) — a port of its own.
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: '@vitest/coverage-v8'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the Go port, and it ships NO compiler API — 7.1 (stable 2026-11-24) is where
      # that arrives. Until then three of our tools cannot run on it, any one of them fatal:
      #   - `nuxi typecheck` → vue-tsc, which needs the TS 6 JS API (vuejs/language-tools#5381);
      #   - typescript-eslint, whose peer is `>=4.8.4 <6.1.0` and which crashes inside
      #     typescript-estree at import when forced — not gated on type-aware rules, which we do not
      #     use (typescript-eslint#10940, work started 2026-09-11);
      #   - unbuild → rollup-plugin-dts for lukk-core's .d.ts emit (peer `^5.9.2`, 13 months stale).
      # Taken in a group bump it failed lint and held nine unrelated updates with it. Drop this entry
      # when all three can run on 7 — watch microsoft/TypeScript#63703 for the 7.1 API.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # h3 2 is not ours to take: Nuxt 3 and 4 both run Nitro on h3 v1, and the module's server
      # handlers are typed against h3 1 (`event.node`, `getRequestHeader`, ...). The h3 the module
      # declares must be the one the host app's Nitro hands it, so a bump here alone only breaks
      # typecheck (#70: `event.node` is possibly undefined under h3 2's types). Drop this entry when
      # the supported Nuxt range moves to an h3 2 Nitro, and port the handlers in that same change.
      - dependency-name: h3
        update-types: ['version-update:semver-major']
      # @nuxt/module-builder 1.x changes what we PUBLISH, so it is held until the build is ported:
      #   - types.d.mts now re-exports LUKK_BFF_PREFIX / LUKK_SESSION_COOKIE from
      #     '../dist/runtime/shared.js', which scripts/fix-type-exports.mjs does not match — the
      #     `type` modifiers survive and a consumer's value import fails with TS1362 again;
      #   - the CJS stub (module.cjs) and the .d.ts twins (module.d.ts, types.d.ts) are gone;
      #   - locally it cannot build at all from a path containing a space (it resolves runtime
      #     imports through a percent-encoded file: URL and fails ERR_MODULE_NOT_FOUND).
      # The runtime/ files and module.d.mts came out byte-identical, so the port is small: teach
      # fix-type-exports the new specifier (with a test), decide on the dropped stubs, and diff
      # `pnpm build` output before and after. Drop this entry in that change.
      - dependency-name: '@nuxt/module-builder'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

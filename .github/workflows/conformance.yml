name: conformance

# Runs the JS clients against a REAL lukk instance, so the TypeScript contract
# can never silently drift from the PHP source. Both delivery modes are covered.
on:
  push:
    branches: [main]
  pull_request:

# Which lukk the fixture is built from. CI used to install `lukk/lukk` from Packagist, which meant
# it validated the clients against the last RELEASE — so a feature still on a branch could not be
# covered at all, and the tests for it failed rather than skipped.
#
# `main` is the steady state. Point it at a branch only while a cross-repo change is in flight, and
# move it back as soon as that lands: a merged branch is usually DELETED, and then every conformance
# run fails at checkout with a bare `git failed with exit code 1` that looks nothing like the
# retarget it actually is.
env:
  LUKK_REPO: stsepelin/lukk
  # TEMPORARY — cross-repo change in flight: stsepelin/lukk#30 adds DELETE /auth/account and
  # GET /auth/account/export, which the specs below now assert. Revert to `main` the moment that
  # PR merges, or the branch gets deleted and every run fails at checkout with a bare
  # `git failed with exit code 1` that looks nothing like the retarget it actually is.
  LUKK_REF: feat/account-deletion

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookie_mode: ['false', 'true']
    name: lukk-core vs real lukk (cookie_mode=${{ matrix.cookie_mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The PHP package, so the fixture is built from source rather than from the last release.
      # A fork PR gets this too (the repo is public); a contributor testing their own lukk fork
      # changes the two `env` values above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LUKK_REPO }}
          ref: ${{ env.LUKK_REF }}
          path: lukk-php

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, bcmath
          tools: composer

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lukk-core build

      # Generate the Laravel host app with lukk installed from the checkout above.
      - name: Build the lukk fixture
        env:
          LUKK_COOKIE_MODE: ${{ matrix.cookie_mode }}
          LUKK_PATH: ${{ github.workspace }}/lukk-php
        run: bash conformance/fixture/build.sh "$RUNNER_TEMP/lukk-fixture"

      # Boot it, wait for /up, then run the conformance flows against it.
      - name: Run conformance flows
        env:
          LUKK_URL: http://127.0.0.1:8000/auth
          LUKK_COOKIE_MODE: ${{ matrix.cookie_mode }}
        run: |
          (cd "$RUNNER_TEMP/lukk-fixture" && php artisan serve --host=127.0.0.1 --port=8000 &)
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/up >/dev/null 2>&1 && break; sleep 1; done
          pnpm --filter lukk-core test:conformance

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: lint · typecheck · test (100% coverage) · build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Build core first (lukk-nuxt depends on it), the module, and prepare the
      # playground so its .nuxt types exist for the Nuxt typecheck.
      - run: pnpm --filter lukk-core build
      - run: pnpm --filter lukk-nuxt build
      - run: pnpm --filter lukk-nuxt exec nuxi prepare playground

      - run: pnpm typecheck
      # Both packages' `test` enforces the 100% coverage threshold (vitest --coverage).
      - run: pnpm test
      # The integration suite drives the real handlers over real sockets. It is NOT part of
      # `pnpm test` (vitest excludes test/integration/**), and for a long time nothing ran it —
      # which is how a bug that fails 11 of its 13 cases shipped in 0.10.0. Anything that depends
      # on genuine HTTP (a `Connection` header, undici's forbidden-header rules, multipart transit)
      # is invisible to the mocked unit suite and only shows up here.
      - run: pnpm --filter lukk-nuxt test:integration
      - run: pnpm build

  nuxt-floor:
    runs-on: ubuntu-latest
    name: oldest supported Nuxt
    # The module supports Nuxt 3 and 4 (`@nuxt/kit: ^3.13.0 || ^4.0.0`) and DEVELOPS against 4, so
    # every other job exercises 4 only — a regression against 3.13-3.21 could pass every check and
    # ship. This installs the declared FLOOR and proves the module still compiles and type-checks
    # against it.
    #
    # The version is derived from package.json rather than written here, so raising the declared
    # floor moves this test with it instead of leaving a stale number behind.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the declared Nuxt floor
        id: floor
        run: |
          # The first version in the range — `^3.13.0 || ^4.0.0` is the 3.x floor, which is the one
          # nothing else tests.
          floor=$(node -p "require('./packages/nuxt/package.json').dependencies['@nuxt/kit'].split('||')[0].replace(/^[^0-9]*/, '').trim()")
          echo "version=$floor" >> "$GITHUB_OUTPUT"
          echo "Declared floor: $floor"

      # Deliberately NOT --frozen-lockfile: the point is to resolve away from the committed tree.
      - name: Downgrade to the floor
        run: |
          pnpm --filter lukk-nuxt add -D \
            "nuxt@${{ steps.floor.outputs.version }}" \
            "@nuxt/schema@${{ steps.floor.outputs.version }}" \
            "@nuxt/kit@${{ steps.floor.outputs.version }}"
          # The playground is its own workspace package and now develops against Nuxt 4; left alone,
          # this job would typecheck the module's floor against a Nuxt 4 app.
          pnpm --filter lukk-nuxt-playground add -D "nuxt@${{ steps.floor.outputs.version }}"
          node -p "'kit resolved to ' + require('./packages/nuxt/node_modules/@nuxt/kit/package.json').version"

      - run: pnpm --filter lukk-core build
      - run: pnpm --filter lukk-nuxt build
      - run: pnpm --filter lukk-nuxt exec nuxi prepare playground
      - run: pnpm --filter lukk-nuxt typecheck
